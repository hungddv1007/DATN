spring.application.name=datn

# Local development: load the repository-root .env as a Java properties file.
# ENV_FILE can override the path in CI/production. Missing file is allowed
# because deployed environments should normally inject real environment variables.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties],optional:file:../../.env[.properties]

# ==========================================
# SECURITY: Sensitive values must be supplied through environment variables.
# Do not add real credentials or fallback secrets to this file.
# ==========================================

# ==========================================
# SQL Server Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GymProDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5MB}
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================================
# Server
# ==========================================
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://qvsmt6pq-5173.asse.devtunnels.ms,https://qvsmt6pq-8080.asse.devtunnels.ms}

# ==========================================
# Payment / Pending transaction
# ==========================================
app.payment.bank-name=${PAYMENT_BANK_NAME:}
app.payment.bank-account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:}
app.payment.bank-account-holder=${PAYMENT_BANK_ACCOUNT_HOLDER:}
app.payment.transfer-prefix=${PAYMENT_TRANSFER_PREFIX:GYMPRO}
app.payment.pending-expiration-hours=${PAYMENT_PENDING_EXPIRATION_HOURS:24}
app.transaction.pending-expiration-cron=${PAYMENT_PENDING_EXPIRATION_CRON:0 0 * * * *}

# MoMo Sandbox. Keep disabled until the three credentials are supplied.
app.payment.momo.enabled=${MOMO_ENABLED:false}
app.payment.momo.base-url=${MOMO_BASE_URL:https://test-payment.momo.vn}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:}
app.payment.momo.redirect-url=${MOMO_REDIRECT_URL:https://qvsmt6pq-5173.asse.devtunnels.ms/member/payment/momo}
app.payment.momo.ipn-url=${MOMO_IPN_URL:https://qvsmt6pq-8080.asse.devtunnels.ms/api/public/payments/momo/ipn}
app.payment.momo.store-name=${MOMO_STORE_NAME:GymPro}
app.payment.momo.expiration-minutes=${MOMO_EXPIRATION_MINUTES:15}

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1800000}

# ==========================================
# Email / SMTP Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Google OAuth2 Configuration
# ==========================================
app.google.client-id=${GOOGLE_CLIENT_ID}

# ==========================================
# Gemini AI Configuration
# ==========================================
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.nutrition-model=${GEMINI_NUTRITION_MODEL:gemini-3.5-flash-lite}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
gemini.chat-complex-model=${GEMINI_CHAT_COMPLEX_MODEL:gemini-3.6-flash}
gemini.timeout=${GEMINI_TIMEOUT:30s}
gemini.chat-history-limit=${GEMINI_CHAT_HISTORY_LIMIT:12}
gemini.free-tier-requests-per-hour=${GEMINI_FREE_TIER_REQUESTS_PER_HOUR:10}
gemini.free-tier-requests-per-day=${GEMINI_FREE_TIER_REQUESTS_PER_DAY:50}
gemini.conversation-retention-days=${GEMINI_CONVERSATION_RETENTION_DAYS:90}

# ==========================================
# Async Thread Pool Configuration
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=AsyncMail-
