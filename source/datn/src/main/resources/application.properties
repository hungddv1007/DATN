spring.application.name=datn

# ==========================================
# SECURITY: Sensitive values must be supplied through environment variables.
# Do not add real credentials or fallback secrets to this file.
# ==========================================

# ==========================================
# SQL Server Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GymProDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5MB}
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1800000}

# ==========================================
# Email / SMTP Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Google OAuth2 Configuration
# ==========================================
app.google.client-id=${GOOGLE_CLIENT_ID}

# ==========================================
# Gemini AI Configuration
# ==========================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
gemini.api.timeout=${GEMINI_TIMEOUT:30s}
